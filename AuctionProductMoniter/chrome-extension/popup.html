<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; margin: 16px; font: 14px system-ui, sans-serif; color: #172033; }
    h1 { margin: 0 0 12px; font-size: 17px; }
    button { width: 100%; margin-top: 14px; padding: 9px; border: 0; border-radius: 6px; background: #2457d6; color: white; cursor: pointer; }
    button.secondary { background: #eef2ff; color: #2949a8; }
    #status { min-height: 18px; margin-top: 10px; font-size: 12px; }
    #screenshotStatus { margin-top: 10px; padding: 9px; border-radius: 6px; background: #eef7f1; color: #17623f; font-size: 12px; line-height: 1.4; }
    #screenshotStatus.failed { background: #fff0ef; color: #a33a31; }
    .hint { color: #667085; font-size: 12px; line-height: 1.4; }
    .section { border-top: 1px solid #e3e7ef; margin-top: 16px; padding-top: 14px; }
    .section-title { font-weight: 700; }
    #diagnostics { max-height: 260px; overflow: auto; margin-top: 10px; }
    .result { margin-bottom: 8px; padding: 9px; border-radius: 6px; background: #f5f7fb; font-size: 12px; }
    .flags { color: #2457d6; font-weight: 600; }
    .sample { margin-top: 4px; color: #4b5565; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Auction Product Monitor</h1>
  <div class="hint">Monitor Whatnot Activity and send new sales to the WPF app.</div>
  <div id="screenshotStatus">Screenshot status: Waiting for a new sale. Keep the Whatnot tab in the foreground while live.</div>
  <div class="section">
    <div class="section-title">Activity Records</div>
    <div class="hint">Shows only buyer names and product numbers detected in Whatnot Activity.</div>
    <button id="sync">Sync to WPF</button>
    <button id="scan" class="secondary">Scan Current Activity</button>
    <div id="scanStatus" class="hint"></div>
    <div id="diagnostics"></div>
    <button id="clear" class="secondary">Clear Activity Records</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
